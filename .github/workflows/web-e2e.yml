name: Web quality and security
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ENV: mainnet
      NEXT_PUBLIC_DEFAULT_CHAIN_ID: "1"
      NEXT_PUBLIC_WALLET_CONNECT_ID: "00000000000000000000000000000000"
      NEXT_PUBLIC_SUBGRAPH_ENDPOINT_MAINNET: https://example.invalid/graphql
      NEXT_PUBLIC_SUBGRAPH_ENDPOINT_2_MAINNET: https://example.invalid/graphql
      NEXT_PUBLIC_SUBGRAPH_ENDPOINT_BASE: https://example.invalid/graphql
      NEXT_PUBLIC_SUBGRAPH_ENDPOINT_2_BASE: https://example.invalid/graphql
      IRON_SESSION_COOKIE_NAME: ci_session
      IRON_SESSION_PASSWORD: ci_only_password_at_least_32_characters_long
      SIWE_DOMAIN: yamawake.xyz
      _AWS_REGION: us-east-1
      _AWS_DYNAMO_TABLE_NAME: ci_metadata
      _AWS_ACCESS_KEY_ID: ci_placeholder
      _AWS_SECRET_ACCESS_KEY: ci_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test authentication, Safe transactions and audit policy
        run: pnpm test:security
      - name: Build production app
        run: pnpm build
      - name: Audit workspace and subgraph lockfiles
        if: always()
        run: pnpm audit:security
      - name: Save dependency audit reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: artifacts/security/
          if-no-files-found: ignore
          retention-days: 14
